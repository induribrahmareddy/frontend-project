<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ffSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14132a"/>
      <stop offset="52%" stop-color="#3a1c36"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="ffGlow" cx="62%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.58"/>
      <stop offset="42%" stop-color="#fb7185" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ffFlare" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="540" fill="url(#ffSky)"/>
  <rect width="1600" height="540" fill="url(#ffGlow)"/>

  <!-- Setting sun disc -->
  <circle cx="990" cy="250" r="105" fill="#fb923c" opacity="0.24"/>
  <circle cx="990" cy="250" r="68" fill="#fbbf24" opacity="0.25"/>

  <!-- Island hills & Clock Tower silhouette -->
  <path d="M0 375 L220 290 L470 345 L720 245 L970 330 L1240 230 L1460 300 L1600 265 L1600 540 L0 540 Z" fill="#171226" opacity="0.92"/>
  <g fill="#0e0c1a">
    <rect x="1080" y="128" width="90" height="270"/>
    <polygon points="1070,128 1125,62 1180,128"/>
    <circle cx="1125" cy="175" r="22" fill="#2a1b30" stroke="#fb923c" stroke-width="3" opacity="0.9"/>
    <line x1="1125" y1="175" x2="1125" y2="160" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="1125" y1="175" x2="1138" y2="179" stroke="#fbbf24" stroke-width="2.5"/>
  </g>

  <!-- Rooftop & Survivor silhouette -->
  <path d="M0 445 L440 395 L690 475 L1600 415 L1600 540 L0 540 Z" fill="#090d18"/>
  <g transform="translate(310, 212)" fill="#080b14">
    <circle cx="52" cy="36" r="21"/>
    <path d="M36 44 L86 24 L94 31 L42 52 Z" fill="#fb7185" opacity="0.9"/>
    <path d="M18 70 L88 64 L106 142 L82 232 L26 232 L8 148 Z"/>
    <path d="M80 94 L165 112 L162 120 L76 105 Z" fill="#191629"/>
  </g>

  <!-- Ember sparks -->
  <g fill="#fbbf24" opacity="0.8">
    <circle cx="720" cy="190" r="3"/>
    <circle cx="810" cy="145" r="2.2"/>
    <circle cx="890" cy="280" r="3.4"/>
    <circle cx="1290" cy="180" r="2.6"/>
    <circle cx="630" cy="310" r="2.4"/>
  </g>
  <line x1="280" y1="420" x2="1420" y2="180" stroke="url(#ffFlare)" stroke-width="2" opacity="0.5"/>
</svg>
