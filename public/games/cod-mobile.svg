<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 540" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="codSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111e"/>
      <stop offset="55%" stop-color="#0f253c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="codGlow" cx="38%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="540" fill="url(#codSky)"/>
  <rect width="1600" height="540" fill="url(#codGlow)"/>

  <!-- Urban standoff skyline -->
  <g fill="#0c1829">
    <rect x="40" y="180" width="120" height="360"/>
    <rect x="190" y="120" width="150" height="420"/>
    <rect x="370" y="210" width="110" height="330"/>
    <rect x="760" y="140" width="160" height="400"/>
    <rect x="960" y="95" width="190" height="445"/>
    <rect x="1190" y="175" width="145" height="365"/>
    <rect x="1370" y="130" width="170" height="410"/>
  </g>

  <!-- Lit tactical windows -->
  <g fill="#38bdf8" opacity="0.35">
    <rect x="220" y="160" width="18" height="10"/>
    <rect x="255" y="160" width="18" height="10"/>
    <rect x="220" y="190" width="18" height="10"/>
    <rect x="1000" y="140" width="24" height="12"/>
    <rect x="1045" y="140" width="24" height="12"/>
    <rect x="1000" y="175" width="24" height="12"/>
    <rect x="1410" y="175" width="22" height="11"/>
  </g>

  <!-- Spotlight helicopter beam -->
  <polygon points="1220,90 1040,470 1320,470" fill="#2dd4bf" opacity="0.1"/>
  <ellipse cx="1220" cy="86" rx="34" ry="10" fill="#132338"/>
  <line x1="1150" y1="74" x2="1290" y2="74" stroke="#94a3b8" stroke-width="3"/>

  <!-- Wet street reflection -->
  <rect x="0" y="425" width="1600" height="115" fill="#070e1a" opacity="0.9"/>
  <line x1="120" y1="452" x2="1480" y2="452" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="360" y1="485" x2="1240" y2="485" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Spec-Ops Operator with glowing NVG visor -->
  <g transform="translate(520, 195)">
    <path d="M52 38 C52 14 98 14 98 38 L104 62 L46 62 Z" fill="#09111d"/>
    <circle cx="64" cy="40" r="6" fill="#2dd4bf"/>
    <circle cx="86" cy="40" r="6" fill="#2dd4bf"/>
    <path d="M22 80 L126 76 L142 175 L118 270 L32 270 L10 175 Z" fill="#070c16"/>
    <path d="M88 122 L210 105 L215 117 L92 136 Z" fill="#122136"/>
    <line x1="215" y1="110" x2="430" y2="85" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
</svg>
